<!DOCTYPE html>
<html>

<head>

    <title>Birthday Surprise</title>

    <link rel="stylesheet"
    href="/static/style.css">

</head>

<body>

    <div class="container">

        <h1>🎁 Birthday Surprise 🎁</h1>

        <h2 id="countdown"></h2>

        <form action="/birthday"
        method="POST">

            <input
            type="text"
            name="name"
            placeholder="Enter Your Name"
            required>

            <br>

            <button type="submit">

                Start Surprise ✨

            </button>

        </form>

    </div>

    <script>

        let count = 5;

        let timer = setInterval(() => {

            document.getElementById(
            "countdown").innerHTML =
            "🎉 Surprise Starts In "
            + count;

            count--;

            if(count < 0) {

                clearInterval(timer);

                document.getElementById(
                "countdown").innerHTML =
                "✨ Ready For Surprise ✨";

            }

        }, 1000);

    </script>

</body>
</html>
